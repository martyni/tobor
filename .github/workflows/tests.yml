name: Tests

on: [push]

jobs:
  build:
    runs-on: self-hosted
    strategy:
      matrix:
        python-version: ["3.8.12", "3.9", "3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}      
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install '.[dev]'
      env:
          MOD_USER_CHANNEL_ID  :  ${{ secrets.MOD_USER_CHANNEL_ID }} 
          MY_CHANNEL_ID        :  ${{ secrets.MY_CHANNEL_ID      }}
          TOBOR_ACCESS_TOKEN   :  ${{ secrets.TOBOR_ACCESS_TOKEN }}
          TOBOR_CLIENT_ID      :  ${{ secrets.TOBOR_CLIENT_ID    }}
          TOBOR_REFRESH_TOKEN  :  ${{ secrets.TOBOR_REFRESH_TOKEN }}
          TOBOR_USER_TOKEN     :  ${{ secrets.TOBOR_USER_TOKEN   }}
    - name: Running tests
      run: ./scripts/test.sh
      env:
          MOD_USER_CHANNEL_ID  :  ${{ secrets.MOD_USER_CHANNEL_ID }} 
          MY_CHANNEL_ID        :  ${{ secrets.MY_CHANNEL_ID      }}
          TOBOR_ACCESS_TOKEN   :  ${{ secrets.TOBOR_ACCESS_TOKEN }}
          TOBOR_CLIENT_ID      :  ${{ secrets.TOBOR_CLIENT_ID    }}
          TOBOR_REFRESH_TOKEN  :  ${{ secrets.TOBOR_REFRESH_TOKEN }}
          TOBOR_USER_TOKEN     :  ${{ secrets.TOBOR_USER_TOKEN   }}
